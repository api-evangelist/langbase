meters:
- name: agent_pipe_runs
  description: Executions of Pipes and Agent runs, metered per run.
  unit: runs
  aggregation: sum
  dimensions:
  - account
  - pipe
  - model
- name: memory_retrievals
  description: Memory retrieval (RAG) requests, metered per request.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - memory
- name: memory_storage
  description: Documents stored and embedded in memory stores.
  unit: documents
  aggregation: sum
  dimensions:
  - account
  - memory
- name: embedding_tokens
  description: Tokens embedded via the Embed API, per embedding model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
- name: parser_documents
  description: Documents parsed via the Parser API (up to 10 MB each).
  unit: documents
  aggregation: sum
  dimensions:
  - account
- name: tool_invocations
  description: Tool calls (web search, crawl) metered per invocation.
  unit: invocations
  aggregation: sum
  dimensions:
  - account
  - tool
- name: subscription
  description: Monthly Pro subscription fee, or Enterprise agreement.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - tier
- name: byok_llm_tokens
  description: >-
    Underlying LLM tokens billed by the downstream provider when using
    bring-your-own-key (LB-LLM-Key). Not billed by Langbase.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - provider
  - model
principles:
- name: Visibility
  description: Track Langbase run, retrieval, and tool usage per API key; separately track downstream LLM token spend when using bring-your-own-key.
- name: Allocation
  description: Scope API keys per Pipe / workload / team and map to internal cost centers.
- name: Optimization
  description: Right-size models via the provider:model_id string; tune topK and chunk sizes to cut embedding and retrieval cost; cache and reuse memory; batch embed up to 100 chunks per request.
- name: Accountability
  description: Assign owners per Pipe / project; review run, retrieval, and BYOK token spend monthly against budget.
maintainers:
