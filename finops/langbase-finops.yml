- LLM
- Serverless
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Langbase spend. Langbase blends subscription tiers (Free, Pro,
  Enterprise) with usage-based metering across its primitives: Pipe / Agent
  runs, Memory storage and retrieval, Parser document parsing, Chunker, Embed
  (per embedding model), and Tools (web search / crawl). When customers bring
  their own LLM provider key via the LB-LLM-Key header, the underlying model
  token spend is billed by the downstream provider (OpenAI, Anthropic, Google,
  and others) rather than by Langbase, splitting cost across two invoices.
notes: >-
  Per-unit rates and included allotments are subject to change; verify against
  the Langbase pricing page during reconciliation.
sources:
- https://langbase.com/pricing
- https://langbase.com/docs
