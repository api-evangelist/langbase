  /beta/user/pipes:
    get:
      operationId: betaUserPipesList
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Langbase: Beta list user pipes'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    owner_login:
                      type: string
                    status:
                      type: string
                      enum:
                      - private
                      - public
                    description:
                      type: string
                    type:
                      type: string
                      enum:
                      - chat
                      - generate
                      default: generate
                    api_key:
                      type: string
                    url:
                      type: string
                  required:
                  - name
                  - owner_login
                  - status
                  - description
                  - api_key
                  - url
        '400':
