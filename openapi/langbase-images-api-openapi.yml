openapi: 3.2.0
info:
  title: Langbase Images API
  version: 1.0.0
servers:
- url: https://api.langbase.com
  description: Production
tags:
- name: Images
paths:
  /v1/images:
    post:
      operationId: images
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Langbase: Image Generation'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                  model:
                    type: string
                  object:
                    type: string
                  created:
                    type: number
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        logprobs: {}
                        finish_reason:
                          type: string
                        native_finish_reason:
                          type: string
                        index:
                          type: number
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                            images:
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                  image_url:
                                    type: object
                                    properties:
                                      url:
                                        type: string
                                    required:
                                    - url
                                  index:
                                    type: number
                                required:
                                - type
                                - image_url
                                - index
                          required:
                          - role
                          - content
                          - images
                      required:
                      - logprobs
                      - finish_reason
                      - native_finish_reason
                      - index
                      - message
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: number
                      completion_tokens:
                        type: number
                      total_tokens:
                        type: number
                      prompt_tokens_details:
                        type: object
                        properties:
                          cached_tokens:
                            type: number
                        required:
                        - cached_tokens
                      completion_tokens_details:
                        type: object
                        properties:
                          reasoning_tokens:
                            type: number
                          image_tokens:
                            type: number
                        required:
                        - reasoning_tokens
                        - image_tokens
                    required:
                    - prompt_tokens
                    - completion_tokens
                    - total_tokens
                    - prompt_tokens_details
                    - completion_tokens_details
                required:
                - id
                - provider
                - model
                - object
                - created
                - choices
                - usage
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Images
      summary: Images
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: Langbase-API-Key
      type: http
      scheme: bearer
      description: 'Enter your Langbase API key with format: Bearer Langbase-API-Key'
