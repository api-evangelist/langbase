openapi: 3.2.0
info:
  title: Langbase Tools API
  version: 1.0.0
servers:
- url: https://api.langbase.com
  description: Production
tags:
- name: Tools
paths:
  /v1/tools/web-search:
    post:
      operationId: v1ToolWebSearch
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        required: true
        name: lb-web-search-key
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                service:
                  type: string
                  enum:
                  - exa
                totalResults:
                  type: number
                  maximum: 10
                  default: 3
                domains:
                  type: array
                  items:
                    type: string
                  maxItems: 3
                  default: []
              required:
              - query
              - service
      responses:
        '200':
          description: 'Langbase: Web search tool v1'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    url:
                      type: string
                    content:
                      type: string
                  required:
                  - url
                  - content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Tools
      summary: V1 tool web search
      x-summary-source: derived
  /v1/tools/crawl:
    post:
      operationId: v1ToolCrawl
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
        required: true
        name: LB-CRAWL-KEY
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: array
                  items:
                    type: string
                    minLength: 1
                maxPages:
                  type: number
                  minimum: 0
                  maximum: 10
                  default: 1
                service:
                  type: string
                  enum:
                  - spider
                  - firecrawl
                  default: spider
              required:
              - url
      responses:
        '200':
          description: 'Langbase: Crawler tool'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    url:
                      type: string
                    content:
                      type: string
                  required:
                  - url
                  - content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Tools
      summary: V1 tool crawl
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: Langbase-API-Key
      type: http
      scheme: bearer
      description: 'Enter your Langbase API key with format: Bearer Langbase-API-Key'
