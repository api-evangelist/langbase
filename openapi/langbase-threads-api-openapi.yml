      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Langbase: Create thread v1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  object:
                    type: string
                    enum:
                    - thread
                  created_at:
                    type: string
                    format: date
                  metadata:
                    type: object
                    additionalProperties:
                      type: string
                      maxLength: 2048
                    default: {}
                required:
                - id
                - object
                - created_at
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
