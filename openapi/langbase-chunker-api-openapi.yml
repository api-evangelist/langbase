openapi: 3.2.0
info:
  title: Langbase Chunker API
  version: 1.0.0
servers:
- url: https://api.langbase.com
  description: Production
tags:
- name: Chunker
paths:
  /v1/chunker:
    post:
      operationId: v1Chunk
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                chunkMaxLength:
                  type: number
                  minimum: 1024
                  maximum: 30000
                  default: 1024
                chunkOverlap:
                  type: number
                  minimum: 256
                  default: 256
              required:
              - content
      responses:
        '200':
          description: 'Langbase: Chunk v1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  chunks:
                    type: array
                    items:
                      type: string
                required:
                - success
                - chunks
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Chunker
      summary: V1 chunk
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: Langbase-API-Key
      type: http
      scheme: bearer
      description: 'Enter your Langbase API key with format: Bearer Langbase-API-Key'
