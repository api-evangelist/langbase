openapi: 3.2.0
info:
  title: Langbase API
  version: 1.0.0
servers:
- url: https://api.langbase.com
  description: Production
tags:
- name: Langbase Api
paths:
  /:
    get:
      operationId: base
      responses:
        '200':
          description: Base of Langbase API
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    description: A message from the Langbase API
                  link:
                    type: string
                    description: Langbase API Docs link.
                required:
                - success
                - message
                - link
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Langbase Api
      summary: Base
      x-summary-source: derived
  /{ownerLogin}/{agent}:
    post:
      operationId: publicComputeRun
      security:
      - bearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: ownerLogin
        in: path
      - schema:
          type: string
          minLength: 1
        required: true
        name: agent
        in: path
      responses:
        '200':
          description: 'Langbase: Compute Run'
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Langbase Api
      summary: Public compute run
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: Langbase-API-Key
      type: http
      scheme: bearer
      description: 'Enter your Langbase API key with format: Bearer Langbase-API-Key'
