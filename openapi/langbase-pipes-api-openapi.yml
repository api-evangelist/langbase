openapi: 3.2.0
info:
  title: Langbase Pipes API
  version: 1.0.0
servers:
- url: https://api.langbase.com
  description: Production
tags:
- name: Pipes
paths:
  /v1/pipes/run:
    post:
      operationId: v1PipeRun
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 'Langbase: Pipe v1 Run'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  completion:
                    type: string
                  raw:
                    type: object
                    properties:
                      id:
                        type: string
                      object:
                        type: string
                      created:
                        type: number
                      model:
                        type: string
                      provider:
                        type: string
                      choices:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: number
                            message:
                              type: object
                              properties:
                                role:
                                  type: string
                                  enum:
                                  - user
                                  - system
                                  - tool
                                  - assistant
                                content:
                                  type:
                                  - string
                                  - 'null'
                                refusal:
                                  type:
                                  - string
                                  - 'null'
                                annotations:
                                  type: array
                                  items: {}
                                tool_calls:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                      type:
                                        type: string
                                        enum:
                                        - function
                                      function:
                                        type: object
                                        properties:
                                          name:
                                            type: string
                                          arguments:
                                            type: string
                                        required:
                                        - name
                                    required:
                                    - id
                                    - type
                                    - function
                              required:
                              - role
                              - content
                              - tool_calls
                            logprobs:
                              type:
                              - string
                              - 'null'
                            finish_reason:
                              type: string
                          required:
                          - index
                          - message
                      usage:
                        type: object
                        properties:
                          prompt_tokens:
                            type: number
                          completion_tokens:
                            type: number
                          total_tokens:
                            type: number
                          prompt_tokens_details:
                            type: object
                            properties:
                              cached_tokens:
                                type: number
                              audio_tokens:
                                type: number
                            required:
                            - cached_tokens
                            - audio_tokens
                          completion_tokens_details:
                            type: object
                            properties:
                              reasoning_tokens:
                                type: number
                              audio_tokens:
                                type: number
                              accepted_prediction_tokens:
                                type: number
                              rejected_prediction_tokens:
                                type: number
                            required:
                            - reasoning_tokens
                            - audio_tokens
                            - accepted_prediction_tokens
                            - rejected_prediction_tokens
                        required:
                        - prompt_tokens
                        - completion_tokens
                        - total_tokens
                      service_tier:
                        type: string
                      system_fingerprint:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - object
                    - created
                    - model
                    - choices
                    - usage
                required:
                - completion
                - raw
            application/octet-stream:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Pipes
      summary: V1 pipe run
      x-summary-source: derived
  /v1/pipes:
    post:
      operationId: v1PipeCreate
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                upsert:
                  type: boolean
                  default: false
                description:
                  type: string
                type:
                  type: string
                  enum:
                  - chat
                  - generate
                  default: generate
                status:
                  type: string
                  enum:
                  - private
                  - public
                  default: public
                model:
                  type: string
                  default: openai:gpt-4.1-mini
                stream:
                  type: boolean
                  default: true
                json:
                  type: boolean
                  default: false
                store:
                  type: boolean
                  default: true
                moderate:
                  type: boolean
                  default: true
                top_p:
                  type: number
                  default: 1
                max_tokens:
                  type: number
                  default: 2048
                temperature:
                  type: number
                  default: 0.7
                presence_penalty:
                  type: number
                  default: 0
                frequency_penalty:
                  type: number
                  default: 0
                stop:
                  type: array
                  items:
                    type: string
                  default: []
                tool_choice:
                  anyOf:
                  - type: string
                    enum:
                    - auto
                    - required
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - function
                        default: function
                      function:
                        type: object
                        properties:
                          name:
                            type: string
                        required:
                        - name
                    required:
                    - function
                  default: auto
                parallel_tool_calls:
                  type: boolean
                  default: true
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - system
                        - function
                        - assistant
                      name:
                        type: string
                      content:
                        type: string
                    required:
                    - role
                    - content
                  default: []
                variables:
                  anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                        value:
                          type: string
                          minLength: 1
                      required:
                      - name
                      - value
                  - type: object
                    additionalProperties:
                      type: string
                      minLength: 1
                  default: []
                tools:
                  anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - function
                          default: function
                        function:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            parameters:
                              type: object
                              additionalProperties: {}
                          required:
                          - name
                      required:
                      - function
                    default: []
                  - type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        parameters:
                          type: object
                          additionalProperties: {}
                      required:
                      - name
                    default: []
                  default: []
                memory:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                    required:
                    - name
                  default: []
              required:
              - name
      responses:
        '200':
          description: 'Langbase: Create pipe v1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  owner_login:
                    type: string
                  status:
                    type: string
                    enum:
                    - private
                    - public
                  description:
                    type: string
                  type:
                    type: string
                    enum:
                    - chat
                    - generate
                    default: generate
                  api_key:
                    type: string
                  url:
                    type: string
                required:
                - name
                - owner_login
                - status
                - api_key
                - url
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      docs:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - docs
                required:
                - success
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                required:
                - success
                - error
                - code
      tags:
      - Pipes
      summary: V1 pipe create
      x-summary-source: derived
