aid: langbase
url: https://raw.githubusercontent.com/api-evangelist/langbase/refs/heads/main/apis.yml
name: Langbase
kind: company
description: Langbase is a serverless AI developer platform for building, deploying,
  and scaling AI agents and applications. Its composable primitives - Pipes (agents),
  Memory (managed RAG), Threads, Agent (one API over 100+ LLMs), Tools, Parser,
  Chunker, and Embed - are exposed through a single Bearer-authenticated REST API
  at api.langbase.com, with Server-Sent Events (SSE) streaming for generative
  endpoints.
